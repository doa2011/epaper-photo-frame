services:
  photo-frame:
    build: .
    restart: unless-stopped
    ports:
      - "${PHOTO_BIND_ADDRESS:-127.0.0.1}:${PHOTO_PORT:-8080}:8080"
    environment:
      PHOTO_API_TOKEN: "${PHOTO_API_TOKEN:?Set PHOTO_API_TOKEN in .env}"
    volumes:
      - type: bind
        source: "${PHOTO_DIRECTORY:?Set PHOTO_DIRECTORY in .env}"
        target: /photos
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
